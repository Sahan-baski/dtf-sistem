services:
  - type: web
    name: dtf-yonetim
    runtime: node
    buildCommand: cd frontend && npm install && npm run build && cp -r dist ../backend/public/ && cd ../backend && npm install
    startCommand: node backend/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
